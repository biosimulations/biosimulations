name: Zenodo archive drift check

# Thin caller of the reusable drift check in virtualcell/zenodo-maint. Weekly (and
# on demand) verifies the latest GitHub release is the latest Zenodo version of the
# BioSimulations concept (DOI 10.5281/zenodo.21053715); opens/updates a tracking
# issue and fails the run on drift. Public APIs only — no secrets.

on:
  schedule:
    - cron: '0 12 * * 1' # weekly, Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    uses: virtualcell/zenodo-maint/.github/workflows/drift.reusable.yml@v1 # NOSONAR(S7637): first-party org action; intentional moving @v1 tag
    with:
      concept_recid: '21053715'
      ref: v1
