name: Archive release to Zenodo

# Thin caller of the reusable workflow in virtualcell/zenodo-maint. Archives each
# published (non-prerelease) release as a new version of the BioSimulations Zenodo
# concept (DOI 10.5281/zenodo.21053715). The reusable workflow handles prerelease
# skipping, per-repo concurrency, and the archiving itself via the maintained
# zenodo-maint CLI — so the logic lives in one place instead of a copy here.
# Requires the ZENODO_TOKEN secret (the account that owns the concept record).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to archive (e.g. v9.66.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  archive:
    uses: virtualcell/zenodo-maint/.github/workflows/archive.reusable.yml@v1.5.0
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      concept_recid: '21053715'
      ref: v1.5.0
    secrets:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
